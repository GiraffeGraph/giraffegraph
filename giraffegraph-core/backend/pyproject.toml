[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "giraffegraph-core-backend"
version = "0.1.0"
description = "Generic graph production engine backend for GiraffeGraph Core."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.0,<2.0.0",
  "anthropic>=1.13.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "neo4j>=6.0.0,<7.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_db: runs against real Postgres and Neo4j; skipped unless GG_TEST_POSTGRES_DSN, GG_TEST_NEO4J_URI and GG_TEST_NEO4J_PASSWORD are set",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
