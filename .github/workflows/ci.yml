name: CI

on:
  push:
    paths:
      - "giraffegraph-core/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "giraffegraph-core/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: giraffegraph-core/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Test
        run: uv run --no-sync pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: giraffegraph-core/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: giraffegraph-core/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
